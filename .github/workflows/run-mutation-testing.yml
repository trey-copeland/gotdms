# Nightly mutation test of the core package (the module root) and of the
# dataset package, as two parallel jobs.
# This does not run on pull requests. .github/workflows/build-and-test-go-module.yml
# is the pull-request gate. A survived mutant is reported; it does not fail this job.
# Gremlins is a CI tool only. It is not a dependency of the gotdms module.

name: 'Run mutation testing on the core and dataset packages'

on:
  schedule:
    # 06:00 UTC every day.
    - cron: '0 6 * * *'
  workflow_dispatch:
  # Temporary: run the dataset job from this branch so a hosted sampler
  # can be collected. Removed before the pull request is opened.
  push:
    branches:
      - cursor/dataset-oom-sampler-7442

permissions:
  contents: read
  actions: write

concurrency:
  group: run-mutation-testing
  cancel-in-progress: false

jobs:
  mutation:
    name: gremlins (core package)
    # A push of the sampler branch runs only the dataset job.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # 45 minutes was too short once daqmx.go landed: run 3 was cancelled
    # at the limit in writer.go. The .gtdx sidecar code adds more mutants.
    # Since --test-cpu was dropped every mutant runs the real suite (before,
    # each one failed at flag parsing), so the run is much longer: about
    # 23 minutes for 8 of the core files on an 8 vCPU VM. 180 minutes is an
    # estimate for the whole package on a 4 vCPU runner, not a measurement.
    timeout-minutes: 180
    steps:
      # Same checkout as build-and-test-go-module.yml. The coverage run is a
      # full `go test`, and TestSegmentIndexV010MissesVersion2 reads v0.1.0
      # with git. Gremlins copies .git into each worker directory.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Gremlins v0.6.0
        # Manual install from https://gremlins.dev/0.6/install/ (Linux tarball).
        # Pinned to v0.6.0. Do not use @latest. Apache-2.0.
        # v0.6.0's go.mod says `go 1.25`, so `go install` needs a newer
        # toolchain than this module. The release binary runs the tests
        # with the Go from go.mod. The checksum is the linux/amd64 line
        # of that release's checksums.txt.
        run: |
          set -euo pipefail
          version=0.6.0
          archive="gremlins_${version}_linux_amd64.tar.gz"
          url="https://github.com/go-gremlins/gremlins/releases/download/v${version}/${archive}"
          curl -fsSL -o "$archive" "$url"
          echo "b02a42e47935f891c9a411d68c07e211c7082609e79c2435b67c85ee9658c538  ${archive}" | sha256sum -c
          tar -xzf "$archive" gremlins
          dest="${RUNNER_TEMP}/gremlins-bin"
          mkdir -p "$dest"
          mv gremlins "$dest/gremlins"
          chmod 755 "$dest/gremlins"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/gremlins" --version
      - name: Unleash on the core package
        # No --test-cpu: Gremlins v0.6.0 passes it to the test binary as the
        # single argument "-cpu N", which the binary rejects as an undefined
        # flag. Every mutant then exits 1 and is reported KILLED, whatever it
        # changed, so the run always showed 0 lived.
        # --timeout-coefficient 4 kills a mutant that runs longer than
        # 4× the coverage run, so one hang cannot stall the job.
        # --threshold-efficacy 0 and --threshold-mcover 0 are the Gremlins
        # defaults: do not exit 10 or 11 when efficacy or mutant coverage
        # is low. LIVED, NOT COVERED, and TIMED OUT stay in this log and
        # in gremlins-report.json. A coverage failure or a Gremlins crash
        # still fails this step. continue-on-error is not set, because
        # that would also hide those failures.
        # dataset/, cmd/, and examples/ are other packages. dataset/ has
        # its own job below. testdata/ is the npTDMS harness (package main);
        # go test never runs it, so every mutant there is NOT COVERED.
        run: |
          gremlins unleash \
            --exclude-files '^dataset/' \
            --exclude-files '^cmd/' \
            --exclude-files '^examples/' \
            --exclude-files '^testdata/' \
            --workers 4 \
            --timeout-coefficient 4 \
            --threshold-efficacy 0 \
            --threshold-mcover 0 \
            --output gremlins-report.json \
            --output-statuses lct
      - name: Upload Gremlins report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-report
          path: gremlins-report.json
          if-no-files-found: warn

  mutation-dataset:
    name: gremlins (dataset package)
    runs-on: ubuntu-latest
    # 30 minutes did not fire on the two real (no --test-cpu) nights.
    # 2026-11-05 job 127085201122 was stopped after 2m22s of this step.
    # 2026-11-06 job 127746242634 was stopped after 4m58s. Both were still
    # printing mutants. The log says the runner received a shutdown signal;
    # the sibling core job, on another runner, finished both nights (107m
    # and 70m). A 4-vCPU local run of edeecbc took 4m19s. Raising this
    # limit does not address those stops. See docs/mutation-testing.md.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Gremlins v0.6.0
        # Manual install from https://gremlins.dev/0.6/install/ (Linux tarball).
        # Pinned to v0.6.0. Do not use @latest. Apache-2.0.
        # v0.6.0's go.mod says `go 1.25`, so `go install` needs a newer
        # toolchain than this module. The release binary runs the tests
        # with the Go from go.mod. The checksum is the linux/amd64 line
        # of that release's checksums.txt.
        run: |
          set -euo pipefail
          version=0.6.0
          archive="gremlins_${version}_linux_amd64.tar.gz"
          url="https://github.com/go-gremlins/gremlins/releases/download/v${version}/${archive}"
          curl -fsSL -o "$archive" "$url"
          echo "b02a42e47935f891c9a411d68c07e211c7082609e79c2435b67c85ee9658c538  ${archive}" | sha256sum -c
          tar -xzf "$archive" gremlins
          dest="${RUNNER_TEMP}/gremlins-bin"
          mkdir -p "$dest"
          mv gremlins "$dest/gremlins"
          chmod 755 "$dest/gremlins"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/gremlins" --version
      - name: Unleash on the dataset package
        # No --test-cpu: Gremlins v0.6.0 passes it to the test binary as the
        # single argument "-cpu N", which the binary rejects as an undefined
        # flag. Every mutant then exits 1 and is reported KILLED, whatever it
        # changed, so the run always showed 0 lived.
        # Same flags as the core job, plus k in --output-statuses.
        # Only dataset/ is mutated: the root package files ('^[^/]+\.go$'),
        # cmd/, examples/, and testdata/ are excluded.
        # The JSON report is written only after a clean finish. A hosted
        # runner shutdown skips the upload step below even with if: always(),
        # so the step log is the only record. k puts every killed mutant in
        # that log as it happens. Do not pass --test-cpu.
        run: |
          set -euo pipefail
          echo "dataset-mutation host nproc=$(nproc) mem_available_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)"
          sampler_log="${GITHUB_WORKSPACE}/dataset-sampler.log"
          : > "${sampler_log}"
          (
            set +e
            while true; do
              {
                echo "=== $(date -u +%Y-%m-%dT%H:%M:%S) ==="
                awk '/^Mem(Total|Free|Available):/ {print}' /proc/meminfo
                cg=$(awk -F: '$1=="0" {print $3; exit}' /proc/self/cgroup)
                dir="/sys/fs/cgroup${cg}"
                if [ ! -d "${dir}" ]; then dir=/sys/fs/cgroup; fi
                echo "cgroup_dir ${dir}"
                for f in memory.current memory.max memory.high memory.events memory.swap.current; do
                  if [ -r "${dir}/${f}" ]; then
                    echo "cgroup ${f}: $(tr '\n' ';' < "${dir}/${f}")"
                  fi
                done
                echo "df_root $(df -B1 --output=avail,size,pcent,iavail,itotal / | tail -1 | tr -s ' ')"
                tmp="${TMPDIR:-/tmp}"
                echo "df_tmp ${tmp} $(df -B1 --output=avail,size,pcent,iavail,itotal "${tmp}" | tail -1 | tr -s ' ')"
                cache=$(go env GOCACHE 2>/dev/null || true)
                if [ -n "${cache}" ] && [ -d "${cache}" ]; then
                  echo "df_gocache ${cache} $(df -B1 --output=avail,size,pcent,iavail,itotal "${cache}" | tail -1 | tr -s ' ')"
                fi
                echo "procs $(ps -e --no-headers | wc -l)"
                ps -eo rss=,pid=,comm= --sort=-rss | head -5 | awk '{printf "top_rss_kb %s pid %s %s\n", $1, $2, $3}'
              } | tee -a "${sampler_log}"
              sleep 3
            done
          ) &
          sampler_pid=$!
          set +e
          gremlins unleash \
            --exclude-files '^[^/]+\.go$' \
            --exclude-files '^cmd/' \
            --exclude-files '^examples/' \
            --exclude-files '^testdata/' \
            --workers 4 \
            --timeout-coefficient 4 \
            --threshold-efficacy 0 \
            --threshold-mcover 0 \
            --output gremlins-report-dataset.json \
            --output-statuses lctk
          status=$?
          kill "${sampler_pid}" 2>/dev/null || true
          wait "${sampler_pid}" 2>/dev/null || true
          exit "${status}"
      - name: Kernel memory notes
        if: always()
        run: |
          set +e
          echo "=== dmesg oom ==="
          dmesg -T 2>/dev/null | grep -i -E 'oom|out of memory|killed process' || echo "dmesg unavailable or no oom lines"
          echo "=== journal oom ==="
          journalctl -k -n 200 --no-pager 2>/dev/null | grep -i -E 'oom|out of memory|killed process' || echo "journal unavailable or no oom lines"
      # if: always() runs after a Gremlins failure. It does not run when the
      # runner itself is shutting down: both 2026-11-05 and 2026-11-06 skipped
      # this step, and neither run has a gremlins-report-dataset artifact.
      - name: Upload sampler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-sampler
          path: dataset-sampler.log
          if-no-files-found: warn
      - name: Upload Gremlins report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-report-dataset
          path: gremlins-report-dataset.json
          if-no-files-found: warn
