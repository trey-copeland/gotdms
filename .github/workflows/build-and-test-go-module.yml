name: 'Build and test Go module'

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-and-test-go-module-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (ubuntu, go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.27"]
        include:
          - go: "1.22"
            race: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race (root package)
        if: matrix.race
        run: go test -race .
      - name: race (dataset)
        if: matrix.race
        run: go test -race ./dataset/

  # npTDMS (https://github.com/adamreeve/npTDMS) is LGPL-3.0-only (the
  # License-Expression in npTDMS 1.13.0's package metadata). It is a CI-only
  # oracle: this job installs it with pip and never imports it from Go. It is
  # not linked into the module, not vendored, and not shipped. The core go.mod
  # stays free of third-party dependencies. There is no LabVIEW in this
  # environment, so npTDMS is the external behavior anchor. The version is
  # pinned so a new npTDMS release cannot turn this job red without a code
  # change; bump it deliberately.
  nptdms:
    name: differential test against npTDMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install npTDMS
        run: pip install npTDMS==1.13.0 pytest
      - name: compare gotdms and npTDMS
        run: python testdata/nptdms/harness.py

  windows:
    name: test (windows, go 1.22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: test
        run: go test ./...
