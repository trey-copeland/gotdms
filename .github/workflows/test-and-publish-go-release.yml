# Tag-triggered GitHub Release for the Go module.
# This file does nothing until it is on main and a v* tag is pushed.
# It does not build binaries, it does not publish to PyPI, and it does not
# call the module proxy. The proxy fetches the tag from GitHub on its own.
# .github/workflows/build-and-test-go-module.yml is the pull-request CI.
# This workflow does not duplicate it.

name: 'Test and publish Go module release'

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: test and create GitHub release
    runs-on: ubuntu-latest
    steps:
      # Same checkout as build-and-test-go-module.yml. Tests read older tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race .
      - name: race dataset
        run: go test -race ./dataset/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
