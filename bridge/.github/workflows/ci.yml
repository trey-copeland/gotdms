# This file lives at bridge/.github/workflows/ci.yml inside the gotdms
# repository. GitHub only runs workflows from the repository root, so gotdms
# CI does not execute this file.
#
# When bridge/ is extracted as the gotdms-python repository, this directory
# becomes .github/workflows at that repo's root. Every path below assumes
# that layout: go.mod, cmd/gotdms-bridge, and python/ are at the repository
# root, not under a bridge/ prefix.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Checkout gotdms
        uses: actions/checkout@v4
        with:
          repository: trey-copeland/gotdms
          path: _gotdms

      # The committed replace is `../`, which is the core module only while
      # this tree lives inside the gotdms checkout. Extraction removes that
      # parent, so point the module at the checkout above.
      - name: Point the module at gotdms
        run: go mod edit -replace github.com/trey-copeland/gotdms=./_gotdms

      - name: Test the bridge
        run: go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install numpy pyarrow polars

      - name: Test the Python client against the built binary
        run: python -m unittest python/tests/test_session.py
