# This file lives at bridge/.github/workflows/release.yml inside the gotdms
# repository and does not run there. After extraction it is
# .github/workflows/release.yml at the root of gotdms-python.
#
# It runs only on a v* tag. The publish job uses PyPI trusted publishing
# (OIDC, id-token: write) and the GitHub environment named pypi. Until that
# environment exists and PyPI has a pending publisher for this repository,
# the publish job cannot succeed. Do not push a tag before that setup.
# See EXTRACTION.md for the one-time steps.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core module
        run: |
          if [ -f ../go.mod ] && head -n 1 ../go.mod | grep -q '^module github.com/trey-copeland/gotdms$'; then
            exit 0
          fi
          git clone --depth 1 https://github.com/trey-copeland/gotdms.git _gotdms
          go mod edit -replace github.com/trey-copeland/gotdms=./_gotdms
      - name: Install build tools
        run: python -m pip install build hatchling twine
      - name: Build sdist
        run: python scripts/build_dist.py --sdist
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  wheels:
    name: wheel ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            plat: manylinux_2_17_x86_64
          - goos: linux
            goarch: arm64
            plat: manylinux_2_17_aarch64
          - goos: darwin
            goarch: amd64
            plat: macosx_11_0_x86_64
          - goos: darwin
            goarch: arm64
            plat: macosx_11_0_arm64
          - goos: windows
            goarch: amd64
            plat: win_amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core module
        run: |
          if [ -f ../go.mod ] && head -n 1 ../go.mod | grep -q '^module github.com/trey-copeland/gotdms$'; then
            exit 0
          fi
          git clone --depth 1 https://github.com/trey-copeland/gotdms.git _gotdms
          go mod edit -replace github.com/trey-copeland/gotdms=./_gotdms
      - name: Install build tools
        run: python -m pip install build hatchling
      - name: Build wheel
        run: python scripts/build_dist.py --goos ${{ matrix.goos }} --goarch ${{ matrix.goarch }} --platform-tag ${{ matrix.plat }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.whl

  publish:
    name: publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      # Official PyPI publish action. release/v1 is the major pin that
      # project documents for trusted publishing. It fails closed until
      # PyPI has a trusted publisher for this repo and workflow.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
